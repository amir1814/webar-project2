<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Web AR</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://rawcdn.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://rawcdn.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-gps.js"></script>

    <style>
        body { margin: 0; overflow: hidden; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; }
    </style>
</head>

<body>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera gps-camera rotation-reader></a-camera>
        
        <!-- مکعب زرد با اندازه‌ی کوچک‌تر (0.4 تا 0.6) -->
        <a-box 
            gps-entity-place="latitude: 35.72498874639343; longitude: 51.38811321942436;"
            material="color: yellow;"
            scale="0.4 0.4 0.4"
            animation="property: scale; to: 0.6 0.6 0.6; dir: alternate; dur: 1000; loop: true">
        </a-box>

        <!-- کره قرمز (اندازه‌اش همان 2 است، دست نمی‌زنیم) -->
        <a-sphere
            gps-entity-place="latitude: 35.72498874639343; longitude: 51.38831321942436;"
            material="color: red;"
            scale="2 2 2"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000;">
        </a-sphere>
    </a-scene>

    <div id="distance" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 1.5rem; color: white; text-shadow: 0 0 5px black;">
        در حال بارگذاری...
    </div>

    <div id="navigator" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 2rem; color: white; text-shadow: 0 0 5px black; display: flex; align-items: center; pointer-events: none;">
        <div class="arrow" style="margin-left: 0.5em; transition: transform 0.2s ease-out;">⬆️</div>
        <div class="text">جلو</div>
    </div>

    <script>
        const targetLat = 35.72498874639343;
        const targetLng = 51.38811321942436;

        function computeBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
            let θ = Math.atan2(y, x) * 180/Math.PI;
            return (θ + 360) % 360;
        }

        const cameraEl = document.querySelector('[gps-camera]');
        const navEl = document.getElementById('navigator');
        const arrowEl = navEl.querySelector('.arrow');
        const textEl = navEl.querySelector('.text');
        const distEl = document.getElementById('distance');

        setInterval(() => {
            const camComp = cameraEl.components['gps-camera'];
            if (!camComp || !camComp.currentCoords) return;

            const { latitude: userLat, longitude: userLng } = camComp.currentCoords;
            const bearingToTarget = computeBearing(userLat, userLng, targetLat, targetLng);
            const heading = cameraEl.getAttribute('rotation').y;

            let diff = (bearingToTarget - heading + 360) % 360;
            let instruction, arrowRot;
            if (diff > 315 || diff <= 45) { instruction = 'جلو'; arrowRot = 'rotate(0deg)'; }
            else if (diff > 45 && diff <= 135) { instruction = 'راست'; arrowRot = 'rotate(90deg)'; }
            else if (diff > 135 && diff <= 225) { instruction = 'عقب'; arrowRot = 'rotate(180deg)'; }
            else { instruction = 'چپ'; arrowRot = 'rotate(270deg)'; }

            const toRad = d => d * Math.PI/180;
            const R = 6371e3;
            const φ1 = toRad(userLat), φ2 = toRad(targetLat);
            const Δφ = toRad(targetLat-userLat), Δλ = toRad(targetLng-userLng);
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
            const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            distEl.textContent = `فاصله تا مکعب: ${dist.toFixed(1)} متر`;
            if (dist < 5) {
                textEl.textContent = 'رسیدید!';
                arrowEl.style.display = 'none';
            } else {
                textEl.textContent = instruction;
                arrowEl.style.display = 'block';
                arrowEl.style.transform = arrowRot;
            }
        }, 500);
    </script>
</body>
</html>

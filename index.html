<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Web AR GPS Cube v3 - فوری</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js">
    </script>
    <script src="https://rawcdn.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js">
    </script>
    <script src="https://rawcdn.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-gps.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
        }

        #debug {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.82);
            color: #0f0;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 13px;
            direction: ltr;
            text-align: left;
            z-index: 100;
            max-width: 92%;
            pointer-events: none;
            line-height: 1.7;
            border: 1px solid rgba(0, 255, 0, 0.35);
            box-shadow: 0 0 24px rgba(0, 255, 0, 0.12);
            backdrop-filter: blur(4px);
            font-family: 'Courier New', monospace;
        }
        #debug .label {
            color: #8af;
        }
        #debug .value {
            color: #0f0;
            font-weight: bold;
        }
        .debug-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 2px 0;
        }
        .debug-row:last-child {
            border-bottom: none;
        }

        #distance {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 0, 0, 0.6);
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 24px;
            border-radius: 30px;
            z-index: 50;
            pointer-events: none;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        #distance span {
            color: #ffd700;
        }

        #navigator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: rgba(0, 0, 0, 0.55);
            padding: 12px 32px;
            border-radius: 60px;
            backdrop-filter: blur(10px);
            z-index: 50;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
            min-width: 200px;
            transition: all 0.3s ease;
        }
        #navigator .arrow {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 2.8rem;
            display: inline-block;
            line-height: 1;
        }
        #navigator .text {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        #navigator .text.arrived {
            color: #ffd700;
            animation: pulse-gold 1.2s ease-in-out infinite;
        }

        @keyframes pulse-gold {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.05);
            }
        }

        #status {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffaa44;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            z-index: 50;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 170, 68, 0.15);
            white-space: nowrap;
            font-weight: 500;
            transition: all 0.4s ease;
        }
        #status.ready {
            color: #4f4;
            border-color: rgba(68, 255, 68, 0.2);
        }
        #status.error {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.2);
        }

        #reset-btn {
            position: absolute;
            bottom: 200px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 22px;
            z-index: 60;
            cursor: pointer;
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        #reset-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        @media (max-width: 480px) {
            #debug {
                font-size: 11px;
                padding: 10px 14px;
                top: 8px;
                left: 8px;
                max-width: 95%;
            }
            #distance {
                font-size: 1.1rem;
                padding: 6px 16px;
                top: 12px;
            }
            #navigator {
                padding: 10px 20px;
                gap: 12px;
                min-width: 160px;
                bottom: 30px;
            }
            #navigator .arrow {
                font-size: 2.2rem;
            }
            #navigator .text {
                font-size: 1.4rem;
            }
            #status {
                font-size: 0.8rem;
                bottom: 100px;
                padding: 4px 14px;
            }
        }
    </style>
</head>

<body>

    <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    >
    <!-- نورپردازی -->
    <a-light type="ambient" intensity="0.9" color="#ffffff"></a-light>
    <a-light type="directional" position="3 8 5" intensity="1.2" color="#fff5e6"></a-light>
    <a-light type="directional" position="-4 6 -3" intensity="0.5" color="#aaccff"></a-light>
    <a-light type="hemisphere" intensity="0.6" color="#87ceeb" ground-color="#3a3a3a"></a-light>

    <!-- دوربین با ارتفاع ۱٫۶ متر -->
    <a-camera
    id="camera"
    gps-camera="minDistance: 1;"
    rotation-reader
    position="0 1.6 0"
    >
</a-camera>

<!-- کانتینر مکعب -->
<a-entity id="cube-container"></a-entity>

</a-scene>

<!-- دیباگ -->
<div id="debug">
    <div class="debug-row">
        <span class="label">📍 دوربین</span>
        <span id="cam-coords" class="value">در انتظار GPS...</span>
    </div>
    <div class="debug-row">
        <span class="label">🎯 مکعب</span>
        <span id="cube-coords" class="value">—</span>
    </div>
    <div class="debug-row">
        <span class="label">📏 فاصله</span>
        <span id="dist-debug" class="value">--</span>
    </div>
    <div class="debug-row">
        <span class="label">🧭 سمت (هدرینگ)</span>
        <span id="heading-debug" class="value">--</span>
    </div>
    <div class="debug-row">
        <span class="label">🎯 زاویه تا هدف</span>
        <span id="bearing-debug" class="value">--</span>
    </div>
    <div class="debug-row">
        <span class="label">📡 دقت GPS</span>
        <span id="accuracy-debug" class="value">--</span>
    </div>
</div>

<!-- فاصله -->
<div id="distance">
    🎯 فاصله تا مکعب: <span id="dist-value">در حال محاسبه...</span>
</div>

<!-- ناویگیتور -->
<div id="navigator">
    <span class="arrow" id="arrow-icon">⬆️</span>
    <span class="text" id="nav-text">جلو</span>
</div>

<!-- وضعیت -->
<div id="status">🔄 منتظر دریافت موقعیت...</div>

<!-- دکمه ریست -->
<button id="reset-btn" title="جای‌گذاری مجدد مکعب">⟳</button>

<script>
    (function() {
        'use strict';

        // ============================================================
        //  متغیرهای اصلی
        // ============================================================
        let cubeLat = null;
        let cubeLng = null;
        let cubeAltitude = 2.8;
        let isCubePlaced = false;
        let deviceHeading = 0;
        let headingValid = false;
        let gpsAccuracy = 999;

        const scene = document.querySelector('a-scene');
        const cameraEl = document.querySelector('[gps-camera]');
        const cubeContainer = document.getElementById('cube-container');

        // المان‌های UI
        const camCoordsEl = document.getElementById('cam-coords');
        const cubeCoordsEl = document.getElementById('cube-coords');
        const distDebugEl = document.getElementById('dist-debug');
        const headingDebugEl = document.getElementById('heading-debug');
        const bearingDebugEl = document.getElementById('bearing-debug');
        const accuracyDebugEl = document.getElementById('accuracy-debug');
        const distValueEl = document.getElementById('dist-value');
        const arrowIcon = document.getElementById('arrow-icon');
        const navText = document.getElementById('nav-text');
        const statusEl = document.getElementById('status');
        const resetBtn = document.getElementById('reset-btn');

        // ============================================================
        //  توابع کمکی
        // ============================================================
        function generateRandomCoords(baseLat, baseLng, minDist = 10, maxDist = 18) {
            const offsetScale = 0.000009;
            const dist = minDist + Math.random() * (maxDist - minDist);
            const angle = Math.random() * 2 * Math.PI;
            const dLat = (dist * Math.cos(angle)) * offsetScale;
            const dLng = (dist * Math.sin(angle)) * offsetScale;
            return {
                lat: baseLat + dLat,
                lng: baseLng + dLng
            };
        }

        function computeBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            let θ = Math.atan2(y, x) * 180 / Math.PI;
            return (θ + 360) % 360;
        }

        function computeDistance(lat1, lon1, lat2, lon2) {
            const toRad = d => d * Math.PI / 180;
            const R = 6371e3;
            const φ1 = toRad(lat1);
            const φ2 = toRad(lat2);
            const Δφ = toRad(lat2 - lat1);
            const Δλ = toRad(lon2 - lon1);
            const a = Math.sin(Δφ / 2) ** 2 +
                Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // ============================================================
        //  قرار دادن مکعب (فوری)
        // ============================================================
        function placeCube(lat, lng, alt) {
            // حذف مکعب قبلی
            while (cubeContainer.firstChild) {
                cubeContainer.removeChild(cubeContainer.firstChild);
            }

            const box = document.createElement('a-box');
            box.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lng}; altitude: ${alt || 2.8};`);
            box.setAttribute('position', '0 0 0');

            box.setAttribute('material', `
                        color: #FFD700;
                        metalness: 0.35;
                        roughness: 0.25;
                        emissive: #553300;
                        emissiveIntensity: 0.15;
                        shader: standard;
                    `);

            box.setAttribute('scale', '0.5 0.5 0.5');

            box.setAttribute('animation', `
                        property: scale;
                        to: 0.58 0.58 0.58;
                        dir: alternate;
                        dur: 1200;
                        loop: true;
                        easing: ease-in-out;
                    `);

            box.setAttribute('animation__rotate', `
                        property: rotation;
                        to: 0 360 0;
                        dur: 12000;
                        loop: true;
                        easing: linear;
                    `);

            box.setAttribute('shadow', 'cast: true; receive: true');

            cubeContainer.appendChild(box);

            cubeLat = lat;
            cubeLng = lng;
            cubeAltitude = alt || 2.8;
            isCubePlaced = true;

            cubeCoordsEl.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}  (ارتفاع ${cubeAltitude.toFixed(1)}m)`;
            statusEl.textContent = '✅ مکعب قرار گرفت!';
            statusEl.className = 'ready';
            resetBtn.style.display = 'flex';

            console.log(`✅ مکعب در (${lat.toFixed(6)}, ${lng.toFixed(6)}) با ارتفاع ${cubeAltitude.toFixed(1)} متر قرار گرفت.`);
        }

        // ============================================================
        //  آپدیت ناویگیتور
        // ============================================================
        function updateNavigator(userLat, userLng) {
            if (!isCubePlaced || cubeLat === null || cubeLng === null) return;

            const dist = computeDistance(userLat, userLng, cubeLat, cubeLng);
            const bearing = computeBearing(userLat, userLng, cubeLat, cubeLng);

            distDebugEl.textContent = `${dist.toFixed(1)} m`;
            bearingDebugEl.textContent = `${bearing.toFixed(1)}°`;
            distValueEl.textContent = `${dist.toFixed(1)} m`;

            const heading = headingValid ? deviceHeading : 0;
            headingDebugEl.textContent = headingValid ?
                `${heading.toFixed(1)}°` :
                '⏳ انتظار برای Compass...';

            let diff = (bearing - heading + 360) % 360;
            let instruction, arrowRot;
            if (diff > 315 || diff <= 45) {
                instruction = '⬆️ جلو';
                arrowRot = 'rotate(0deg)';
            } else if (diff > 45 && diff <= 135) {
                instruction = '➡️ راست';
                arrowRot = 'rotate(90deg)';
            } else if (diff > 135 && diff <= 225) {
                instruction = '⬇️ عقب';
                arrowRot = 'rotate(180deg)';
            } else {
                instruction = '⬅️ چپ';
                arrowRot = 'rotate(270deg)';
            }

            if (dist < 4) {
                instruction = '🎯 رسیدید!';
                navText.textContent = 'رسیدید! 🎉';
                navText.className = 'text arrived';
                arrowIcon.style.display = 'none';
            } else {
                navText.textContent = instruction;
                navText.className = 'text';
                arrowIcon.style.display = 'block';
                arrowIcon.style.transform = arrowRot;
            }

            if (dist < 5) {
                statusEl.textContent = `🎯 در کنار مکعب! (${dist.toFixed(1)}m)`;
                statusEl.className = 'ready';
            } else if (dist < 30) {
                statusEl.textContent = `👀 نزدیک! (${dist.toFixed(1)}m)`;
                statusEl.className = '';
            } else {
                statusEl.textContent = `🔭 فاصله: ${dist.toFixed(1)}m`;
                statusEl.className = '';
            }
        }

        // ============================================================
        //  حلقه اصلی (بدون تثبیت)
        // ============================================================
        let lastUpdate = 0;
        const UPDATE_INTERVAL = 300;

        function mainLoop(time) {
            if (time - lastUpdate < UPDATE_INTERVAL) {
                requestAnimationFrame(mainLoop);
                return;
            }
            lastUpdate = time;

            const camComp = cameraEl.components['gps-camera'];
            if (!camComp || !camComp.currentCoords) {
                statusEl.textContent = '⏳ در انتظار GPS...';
                statusEl.className = '';
                requestAnimationFrame(mainLoop);
                return;
            }

            const {
                latitude: userLat,
                longitude: userLng
            } = camComp.currentCoords;

            gpsAccuracy = camComp.currentCoords.accuracy || 999;

            camCoordsEl.textContent = `${userLat.toFixed(6)}, ${userLng.toFixed(6)}`;
            accuracyDebugEl.textContent = gpsAccuracy < 50 ?
                `${gpsAccuracy.toFixed(0)}m ✅` :
                `${gpsAccuracy.toFixed(0)}m ⚠️`;

            // ====== قرار دادن مکعب در اولین فرصت ======
            if (!isCubePlaced) {
                // حتی اگر دقت کم باشد، مکعب را قرار بده
                const randomPos = generateRandomCoords(userLat, userLng, 10, 18);
                placeCube(randomPos.lat, randomPos.lng, 2.8);
                statusEl.textContent = '✅ مکعب بلافاصله قرار گرفت!';
                statusEl.className = 'ready';
                requestAnimationFrame(mainLoop);
                return;
            }

            // ====== بروزرسانی ناویگیتور ======
            updateNavigator(userLat, userLng);

            requestAnimationFrame(mainLoop);
        }

        // ============================================================
        //  Compass
        // ============================================================
        if (window.DeviceOrientationEvent) {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientationabsolute', onCompass);
                            console.log('✅ مجوز Compass دریافت شد.');
                        } else {
                            console.warn('⚠️ مجوز Compass رد شد، از fallback استفاده می‌شود.');
                            fallbackCompass();
                        }
                    })
                    .catch(err => {
                        console.warn('⚠️ درخواست مجوز Compass با خطا مواجه شد:', err);
                        fallbackCompass();
                    });
            } else {
                window.addEventListener('deviceorientationabsolute', onCompass);
                setTimeout(() => {
                    if (!headingValid) {
                        console.warn('⚠️ Compass فعال نشد، از fallback استفاده می‌شود.');
                        fallbackCompass();
                    }
                }, 3000);
            }
        } else {
            console.warn('⚠️ DeviceOrientationEvent پشتیبانی نمی‌شود.');
            fallbackCompass();
        }

        function onCompass(e) {
            if (e.alpha !== null && e.alpha !== undefined) {
                deviceHeading = e.alpha;
                headingValid = true;
            }
        }

        function fallbackCompass() {
            console.log('🔄 استفاده از fallback Compass (rotation-reader)');
            setInterval(() => {
                if (!headingValid) {
                    const rot = cameraEl.getAttribute('rotation');
                    if (rot && rot.y !== undefined) {
                        let h = rot.y % 360;
                        if (h < 0) h += 360;
                        deviceHeading = h;
                        headingValid = true;
                    }
                }
            }, 500);
        }

        // ============================================================
        //  رویدادها
        // ============================================================
        window.addEventListener('gps-camera-error', (e) => {
            statusEl.textContent = '❌ خطای GPS: ' + (e.detail?.message || 'لطفاً موقعیت را فعال کنید');
            statusEl.className = 'error';
            console.error('GPS Error:', e.detail);
        });

        scene.addEventListener('loaded', () => {
            statusEl.textContent = '✅ صحنه بارگذاری شد. منتظر GPS...';
            statusEl.className = '';
            console.log('🚀 Web AR GPS Cube v3 (فوری) راه‌اندازی شد.');
        });

        // ============================================================
        //  دکمه ریست
        // ============================================================
        resetBtn.addEventListener('click', () => {
            if (!isCubePlaced) return;
            while (cubeContainer.firstChild) {
                cubeContainer.removeChild(cubeContainer.firstChild);
            }
            isCubePlaced = false;
            cubeLat = null;
            cubeLng = null;
            statusEl.textContent = '🔄 در حال جای‌گذاری مجدد...';
            statusEl.className = '';
            cubeCoordsEl.textContent = '—';
            distValueEl.textContent = 'در حال محاسبه...';
            distDebugEl.textContent = '--';
            navText.textContent = 'جلو';
            navText.className = 'text';
            arrowIcon.style.display = 'block';
            arrowIcon.style.transform = 'rotate(0deg)';
            resetBtn.style.display = 'none';
            console.log('🔄 ریست شد، منتظر GPS برای جای‌گذاری مجدد...');
        });

        // ============================================================
        //  شروع
        // ============================================================
        requestAnimationFrame(mainLoop);

        console.log('📡 Web AR GPS Cube v3 - بدون تثبیت، قرارگیری فوری');
        console.log('   🔹 ارتفاع دوربین: ۱٫۶ متر');
        console.log('   🔹 اندازه مکعب: ۵۰ سانتی‌متر');
        console.log('   🔹 مکعب به محض دریافت GPS قرار می‌گیرد');

    })();
</script>

</body>
</html>

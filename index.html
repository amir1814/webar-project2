<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Web AR - پروژه</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://rawcdn.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://rawcdn.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-gps.js"></script>

    <style>
        body { margin: 0; overflow: hidden; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; }
        #debug {
            position: absolute;
            top: 80px;
            left: 10px;
            color: lime;
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            max-width: 90%;
            direction: ltr;
            text-align: left;
        }
        #distance {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            color: white;
            text-shadow: 0 0 5px black;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
        }
        #navigator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            color: white;
            text-shadow: 0 0 5px black;
            display: flex;
            align-items: center;
            pointer-events: none;
            background: rgba(0,0,0,0.4);
            padding: 10px 20px;
            border-radius: 30px;
        }
        .arrow { margin-left: 0.5em; transition: transform 0.2s ease-out; }
    </style>
</head>

<body>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera gps-camera rotation-reader></a-camera>
        
        <!-- مکعب (موقعیت آن توسط جاوااسکریپت تنظیم می‌شود) -->
        <a-box id="cube"
            material="color: yellow;"
            scale="0.25 0.25 0.25"
            animation="property: scale; to: 0.35 0.35 0.35; dir: alternate; dur: 1000; loop: true">
        </a-box>

        <!-- کره قرمز (اختیاری، در فاصله‌ای دیگر) -->
        <a-sphere id="sphere"
            material="color: red;"
            scale="1.5 1.5 1.5"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000;">
        </a-sphere>
    </a-scene>

    <!-- دیباگ: نمایش مختصات -->
    <div id="debug">
        منتظر موقعیت GPS...
    </div>

    <div id="distance">فاصله: -- متر</div>

    <div id="navigator">
        <div class="arrow">⬆️</div>
        <div class="text">جلو</div>
    </div>

    <script>
        // متغیرهای هدف (مکعب و کره)
        let targetLat = null;
        let targetLng = null;
        let targetSet = false; // آیا مختصات هدف تولید شده؟

        // المان‌های DOM
        const cubeEl = document.getElementById('cube');
        const sphereEl = document.getElementById('sphere');
        const debugEl = document.getElementById('debug');
        const distEl = document.getElementById('distance');
        const navEl = document.getElementById('navigator');
        const arrowEl = navEl.querySelector('.arrow');
        const textEl = navEl.querySelector('.text');
        const cameraEl = document.querySelector('[gps-camera]');

        // تابع تولید مختصات تصادفی در فاصله‌ی بین minDist تا maxDist متر از نقطه ورودی
        function randomNearby(lat, lng, minDist = 10, maxDist = 15) {
            const R = 6371000; // شعاع زمین به متر
            
            // انتخاب فاصله‌ی تصادفی بین minDist و maxDist
            const dist = minDist + Math.random() * (maxDist - minDist);
            
            // انتخاب زاویه‌ی تصادفی (۰ تا ۳۶۰ درجه)
            const angle = Math.random() * 2 * Math.PI;
            
            // محاسبه تغییرات طول و عرض بر اساس فاصله و زاویه
            const dLat = (dist * Math.cos(angle)) / R * (180 / Math.PI);
            const dLng = (dist * Math.sin(angle)) / (R * Math.cos(lat * Math.PI / 180)) * (180 / Math.PI);
            
            return { lat: lat + dLat, lng: lng + dLng };
        }

        // تابع محاسبه فاصله (هاورساین)
        function calcDistance(lat1, lng1, lat2, lng2) {
            const toRad = d => d * Math.PI / 180;
            const R = 6371000;
            const φ1 = toRad(lat1), φ2 = toRad(lat2);
            const Δφ = toRad(lat2 - lat1), Δλ = toRad(lng2 - lng1);
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // تابع محاسبه bearing
        function computeBearing(lat1, lng1, lat2, lng2) {
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δλ = (lng2 - lng1) * Math.PI/180;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
            let θ = Math.atan2(y, x) * 180/Math.PI;
            return (θ + 360) % 360;
        }

        // تابع به‌روزرسانی موقعیت مکعب و کره
        function setTargetCoords(lat, lng) {
            targetLat = lat;
            targetLng = lng;
            const height = 0.7; // ارتفاع ۰٫۷ متر (بین ۰٫۵ تا ۱)

            // تنظیم موقعیت مکعب
            cubeEl.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lng};`);
            cubeEl.setAttribute('position', `0 ${height} 0`);

            // تنظیم موقعیت کره (چند متر آنطرف‌تر برای تنوع)
            const offset = 0.00002; // حدود ۲ متر
            sphereEl.setAttribute('gps-entity-place', `latitude: ${lat + offset}; longitude: ${lng + offset};`);
            sphereEl.setAttribute('position', `0 ${height} 0`);

            targetSet = true;
            debugEl.innerHTML = `🎯 هدف: ${lat.toFixed(6)}, ${lng.toFixed(6)}<br>ارتفاع: ${height} متر`;
        }

        // حلقه اصلی (هر ۵۰۰ میلی‌ثانیه)
        setInterval(() => {
            const camComp = cameraEl.components['gps-camera'];
            if (!camComp || !camComp.currentCoords) {
                debugEl.innerHTML = '⏳ منتظر GPS...';
                return;
            }

            const { latitude: userLat, longitude: userLng } = camComp.currentCoords;

            // اگر هنوز هدف تعیین نشده، یک نقطه تصادفی در فاصله‌ی ۱۰ تا ۱۵ متری تولید کن
            if (!targetSet) {
                const random = randomNearby(userLat, userLng, 10, 15);
                setTargetCoords(random.lat, random.lng);
                debugEl.innerHTML += `<br>📍 موقعیت شما: ${userLat.toFixed(6)}, ${userLng.toFixed(6)}`;
            }

            // به‌روزرسانی دیباگ با موقعیت لحظه‌ای دوربین
            debugEl.innerHTML = `📍 دوربین: ${userLat.toFixed(6)}, ${userLng.toFixed(6)}<br>🎯 هدف: ${targetLat.toFixed(6)}, ${targetLng.toFixed(6)}`;

            // محاسبه فاصله و جهت
            const dist = calcDistance(userLat, userLng, targetLat, targetLng);
            distEl.textContent = `فاصله تا مکعب: ${dist.toFixed(1)} متر`;

            if (dist < 5) {
                textEl.textContent = 'رسیدید!';
                arrowEl.style.display = 'none';
                return;
            }

            // محاسبه bearing و جهت
            const bearing = computeBearing(userLat, userLng, targetLat, targetLng);
            const heading = cameraEl.getAttribute('rotation').y;
            let diff = (bearing - heading + 360) % 360;
            let instruction, arrowRot;
            if (diff > 315 || diff <= 45) { instruction = 'جلو'; arrowRot = 'rotate(0deg)'; }
            else if (diff > 45 && diff <= 135) { instruction = 'راست'; arrowRot = 'rotate(90deg)'; }
            else if (diff > 135 && diff <= 225) { instruction = 'عقب'; arrowRot = 'rotate(180deg)'; }
            else { instruction = 'چپ'; arrowRot = 'rotate(270deg)'; }

            textEl.textContent = instruction;
            arrowEl.style.display = 'block';
            arrowEl.style.transform = arrowRot;

        }, 500);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Web AR - Dynamic Cube</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://rawcdn.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://rawcdn.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-gps.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #debug {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            direction: ltr;
            text-align: left;
            z-index: 100;
            max-width: 90%;
            pointer-events: none;
            line-height: 1.6;
            border: 1px solid #0f0;
            box-shadow: 0 0 15px rgba(0,255,0,0.3);
        }
        #debug .label {
            color: #aaa;
        }
        #debug .value {
            color: #0f0;
            font-weight: bold;
        }
        #distance {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            color: white;
            text-shadow: 0 0 10px black;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 50;
            pointer-events: none;
        }
        #navigator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.2rem;
            color: white;
            text-shadow: 0 0 10px black;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.4);
            padding: 10px 25px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            z-index: 50;
            pointer-events: none;
        }
        .arrow {
            transition: transform 0.2s ease-out;
            font-size: 2.5rem;
        }
        .text {
            font-size: 1.8rem;
            font-weight: bold;
        }
        #status {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffaa00;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 1rem;
            z-index: 50;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera gps-camera rotation-reader></a-camera>
        
        <!-- مکعب به‌صورت پویا توسط جاوااسکریپت ساخته می‌شود -->
        <a-entity id="cube-container"></a-entity>
    </a-scene>

    <!-- دیباگ مختصات -->
    <div id="debug">
        <div><span class="label">📍 دوربین (lat, lng):</span> <span id="cam-coords" class="value">در انتظار GPS...</span></div>
        <div><span class="label">🎯 مکعب (lat, lng):</span> <span id="cube-coords" class="value">هنوز مشخص نشده</span></div>
        <div><span class="label">📏 فاصله:</span> <span id="dist-debug" class="value">--</span></div>
        <div><span class="label">🧭 سمت (heading):</span> <span id="heading-debug" class="value">--</span></div>
    </div>

    <div id="distance">📍 فاصله تا مکعب: <span id="dist-value">در حال محاسبه...</span></div>

    <div id="navigator">
        <span class="arrow" id="arrow-icon">⬆️</span>
        <span class="text" id="nav-text">جلو</span>
    </div>

    <div id="status">🔄 منتظر دریافت موقعیت...</div>

    <script>
        // ============================================================
        //  متغیرهای اصلی
        // ============================================================
        let cubeLat = null;
        let cubeLng = null;
        let cubeAltitude = 2.8; // ارتفاع ۲٫۸ متر
        let isCubePlaced = false;

        const scene = document.querySelector('a-scene');
        const cameraEl = document.querySelector('[gps-camera]');
        const cubeContainer = document.getElementById('cube-container');

        // المان‌های دیباگ
        const camCoordsEl = document.getElementById('cam-coords');
        const cubeCoordsEl = document.getElementById('cube-coords');
        const distDebugEl = document.getElementById('dist-debug');
        const headingDebugEl = document.getElementById('heading-debug');
        const distValueEl = document.getElementById('dist-value');
        const arrowIcon = document.getElementById('arrow-icon');
        const navText = document.getElementById('nav-text');
        const statusEl = document.getElementById('status');

        // ============================================================
        //  توابع کمکی
        // ============================================================
        function generateRandomCoords(baseLat, baseLng, minDist = 10, maxDist = 15) {
            const offsetScale = 0.000009;
            const dist = minDist + Math.random() * (maxDist - minDist);
            const angle = Math.random() * 2 * Math.PI;
            const dLat = (dist * Math.cos(angle)) * offsetScale;
            const dLng = (dist * Math.sin(angle)) * offsetScale;
            return {
                lat: baseLat + dLat,
                lng: baseLng + dLng
            };
        }

        function computeBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
            let θ = Math.atan2(y, x) * 180/Math.PI;
            return (θ + 360) % 360;
        }

        function computeDistance(lat1, lon1, lat2, lon2) {
            const toRad = d => d * Math.PI/180;
            const R = 6371e3;
            const φ1 = toRad(lat1), φ2 = toRad(lat2);
            const Δφ = toRad(lat2-lat1), Δλ = toRad(lon2-lon1);
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // ============================================================
        //  ساخت مکعب در موقعیت جدید (اسکیل ۰٫۱ = ۱۰ سانتی‌متر)
        // ============================================================
        function placeCube(lat, lng, alt = 2.8) {
            while (cubeContainer.firstChild) {
                cubeContainer.removeChild(cubeContainer.firstChild);
            }

            const box = document.createElement('a-box');
            box.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lng}; altitude: ${alt};`);
            box.setAttribute('position', '0 0 0');
            box.setAttribute('material', 'color: yellow;');
            
            // ⭐ اسکیل ۰٫۱ = ۱۰ سانتی‌متر
            box.setAttribute('scale', '0.1 0.1 0.1');
            // انیمیشن بزرگ‌شدن تا ۰٫۱۵ (۱۵ سانتی‌متر)
            box.setAttribute('animation', 'property: scale; to: 0.15 0.15 0.15; dir: alternate; dur: 1000; loop: true');

            cubeContainer.appendChild(box);

            cubeLat = lat;
            cubeLng = lng;
            cubeAltitude = alt;
            isCubePlaced = true;

            cubeCoordsEl.textContent = `${lat.toFixed(7)}, ${lng.toFixed(7)} (ارتفاع ${alt.toFixed(2)} متر)`;
            statusEl.textContent = '✅ مکعب قرار گرفت!';
            statusEl.style.color = '#0f0';

            console.log(`✅ مکعب در مختصات (${lat}, ${lng}) با ارتفاع ${alt} متر قرار گرفت.`);
        }

        // ============================================================
        //  حلقه‌ی اصلی بروزرسانی (هر ۵۰۰ میلی‌ثانیه)
        // ============================================================
        setInterval(() => {
            const camComp = cameraEl.components['gps-camera'];
            if (!camComp || !camComp.currentCoords) {
                statusEl.textContent = '⏳ در انتظار GPS...';
                return;
            }

            const { latitude: userLat, longitude: userLng } = camComp.currentCoords;

            camCoordsEl.textContent = `${userLat.toFixed(7)}, ${userLng.toFixed(7)}`;

            if (!isCubePlaced) {
                const randomPos = generateRandomCoords(userLat, userLng, 10, 15);
                const alt = 2.8;
                placeCube(randomPos.lat, randomPos.lng, alt);
            }

            if (isCubePlaced && cubeLat !== null && cubeLng !== null) {
                const dist = computeDistance(userLat, userLng, cubeLat, cubeLng);
                const bearing = computeBearing(userLat, userLng, cubeLat, cubeLng);
                const heading = cameraEl.getAttribute('rotation').y;

                distDebugEl.textContent = `${dist.toFixed(1)} متر`;
                headingDebugEl.textContent = `${heading.toFixed(1)}°`;
                distValueEl.textContent = `${dist.toFixed(1)} متر`;

                let diff = (bearing - heading + 360) % 360;
                let instruction, arrowRot;
                if (diff > 315 || diff <= 45) { instruction = 'جلو'; arrowRot = 'rotate(0deg)'; }
                else if (diff > 45 && diff <= 135) { instruction = 'راست'; arrowRot = 'rotate(90deg)'; }
                else if (diff > 135 && diff <= 225) { instruction = 'عقب'; arrowRot = 'rotate(180deg)'; }
                else { instruction = 'چپ'; arrowRot = 'rotate(270deg)'; }

                navText.textContent = instruction;
                arrowIcon.style.transform = arrowRot;

                if (dist < 5) {
                    navText.textContent = 'رسیدید! 🎉';
                    arrowIcon.style.display = 'none';
                } else {
                    arrowIcon.style.display = 'block';
                }

                if (dist < 50) {
                    statusEl.textContent = `👀 نزدیک! (${dist.toFixed(1)} متر)`;
                } else {
                    statusEl.textContent = `🔭 فاصله: ${dist.toFixed(1)} متر`;
                }
            }
        }, 500);

        scene.addEventListener('loaded', () => {
            statusEl.textContent = '✅ صحنه بارگذاری شد. منتظر GPS...';
        });

        window.addEventListener('gps-camera-error', (e) => {
            statusEl.textContent = '❌ خطای GPS: ' + (e.detail.message || 'لطفاً موقعیت را فعال کنید');
            statusEl.style.color = '#ff4444';
        });

        console.log('🚀 برنامه WebAR با مکعب پویا راه‌اندازی شد.');
    </script>
</body>
</html>
